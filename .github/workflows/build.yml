name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pillow
      - name: Make app.ico from icon.png
        run: python -c "from PIL import Image; Image.open('icon.png').convert('RGBA').save('app.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: Build single-file exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name BaturTeacherTalking --icon app.ico
          --add-data "app.ico;." --add-data "icon.png;."
          --collect-all soundcard --collect-all sounddevice
          app.py
      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process dist\BaturTeacherTalking.exe -ArgumentList "--selftest" -PassThru -Wait
          Get-Content "$env:TEMP\btt_selftest.txt"
          if ($p.ExitCode -ne 0) { throw "self-test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/BaturTeacherTalking.exe

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple silicon (M1-M4): app runs on macOS 11 Big Sur and newer
            arch: arm64
            min_os: "11.0"
          - runner: macos-15-intel    # Intel Macs: app runs on macOS 10.13 High Sierra and newer
            arch: x86_64
            min_os: "10.13"
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.min_os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install python.org Python 3.11 (built for old macOS)
        run: |
          curl -fsSLo py.pkg https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg
          sudo installer -pkg py.pkg -target /
          PY=/Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11
          $PY -m venv venv
          echo "$PWD/venv/bin" >> $GITHUB_PATH
      - name: Install dependencies (wheels that support old macOS)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
      - name: Build .app
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name "Batur Teacher Talking" --icon icon.png
          --osx-bundle-identifier com.batur.teachertalking
          --add-data "icon.png:."
          --collect-all sounddevice
          app.py
      - name: Microphone permission text, minimum macOS, ad-hoc signature
        run: |
          APP="dist/Batur Teacher Talking.app"
          plutil -insert NSMicrophoneUsageDescription -string "Batur Teacher Talking listens to the microphone to show live captions." "$APP/Contents/Info.plist"
          plutil -replace LSMinimumSystemVersion -string "${{ matrix.min_os }}" "$APP/Contents/Info.plist"
          codesign --force --deep -s - "$APP"
      - name: Check every binary runs on macOS ${{ matrix.min_os }}
        run: |
          python - "dist/Batur Teacher Talking.app" "${{ matrix.min_os }}" <<'PY'
          import os, subprocess, sys
          app, limit = sys.argv[1], tuple(int(x) for x in sys.argv[2].split("."))
          MAGIC = (b"\xcf\xfa\xed\xfe", b"\xca\xfe\xba\xbe", b"\xbe\xba\xfe\xca")
          def min_versions(text):
              # LC_BUILD_VERSION -> "minos X.Y" ; LC_VERSION_MIN_MACOSX -> "version X.Y"
              t, out, in_old = text.split(), [], False
              for i, w in enumerate(t):
                  if w == "LC_VERSION_MIN_MACOSX": in_old = True
                  elif w == "cmd": in_old = False if t[i+1] != "LC_VERSION_MIN_MACOSX" else in_old
                  if w == "minos" or (w == "version" and in_old):
                      out.append(tuple(int(x) for x in t[i+1].split(".")))
              return out
          worst, bad = (0,), set()
          for root, _, files in os.walk(app):
              for f in files:
                  p = os.path.join(root, f)
                  if os.path.islink(p): continue
                  with open(p, "rb") as fh:
                      if fh.read(4) not in MAGIC: continue
                  for v in min_versions(subprocess.run(["otool", "-l", p], capture_output=True, text=True).stdout):
                      worst = max(worst, v)
                      if v > limit: bad.add((p[len(app):], ".".join(map(str, v))))
          print(f"::notice::highest minimum macOS among all binaries: {'.'.join(map(str, worst))}")
          for b in sorted(bad): print(f"::error::needs macOS {b[1]}: {b[0]}")
          sys.exit(1 if bad else 0)
          PY
      - name: Self-test
        run: |
          BTT_SELFTEST_OUT="$RUNNER_TEMP/st.txt" "dist/Batur Teacher Talking.app/Contents/MacOS/Batur Teacher Talking" --selftest
          cat "$RUNNER_TEMP/st.txt"
      - name: Zip
        run: ditto -c -k --keepParent "dist/Batur Teacher Talking.app" "BaturTeacherTalking-mac-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: BaturTeacherTalking-mac-${{ matrix.arch }}.zip

  release:
    needs: [windows, mac]
    if: ${{ always() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Batur Teacher Talking v1.0.${{ github.run_number }}
          body: |
            **Windows** — PowerShell:
            ```
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
            ```
            **Mac** — Terminal:
            ```
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```
            Or download the file for your system below.
          files: out/*
          make_latest: true
